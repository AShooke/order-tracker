name: Test, build, and local deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: uv run --frozen pytest -q
      - name: Build image
        run: docker build -t "order-tracker:${GITHUB_SHA::12}" .
      - name: Deploy and verify locally with act
        run: |
          if [ "${ACT:-}" != "true" ]; then
            echo "Deployment runs locally with act, where Docker Compose can access your machine."
            exit 0
          fi
          export ORDER_TRACKER_TAG="${GITHUB_SHA::12}"
          export RELEASE_SHA="$GITHUB_SHA"
          docker compose up -d --no-build --wait
          docker compose exec -T app python -c "
          import json, urllib.request
          base = 'http://127.0.0.1:8000'
          assert json.load(urllib.request.urlopen(base + '/healthz'))['status'] == 'ok'
          assert json.load(urllib.request.urlopen(base + '/version'))['release'] == '$GITHUB_SHA'
          assert len(json.load(urllib.request.urlopen(base + '/api/orders'))) >= 3
          print('Deployed release $GITHUB_SHA and smoke checks passed')
          "
