apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-5xx
    folder: Order Tracker
    interval: 1m
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (route) (
                  increase(http_server_request_count_total{
                    service_name="order-tracker",
                    http_status_code=~"5.."
                  }[5m])
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: order-tracker-requests
        panelId: 2
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "5xx response detected for {{ $labels.route }}"
          description: "The Order Tracker endpoint {{ $labels.route }} returned one or more 5xx responses in the last 5 minutes."
          affected_endpoint: "{{ $labels.route }}"
          time_window: "5 minutes"
          dashboard_url: "http://127.0.0.1:3000/d/order-tracker-requests/order-tracker-requests?viewPanel=2"
        labels:
          service: order-tracker
          severity: critical
          time_window: 5m
